<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>heightlab</title>
    <style>
      html, body, canvas { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2a2428; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

      const params = new URLSearchParams(location.search)
      const cam = params.get('cam') === 'top' ? 'top' : 'game'
      const root = '/public/assets/kaykit/dungeon-1.1'
      const [places, nav] = await Promise.all([
        fetch('/data/heightlab.places.json').then((r) => r.json()),
        fetch('/data/heightlab.json').then((r) => r.json()),
      ])
      const cells = []
      for (const row of nav.rowsCells) cells.push(...row)
      const stairs = new Map(nav.stairs.map((s) => [`${s.x},${s.z}`, s]))
      function groundY(x, z) {
        const cx = Math.floor((x - nav.originX) / nav.cell)
        const cz = Math.floor((z - nav.originZ) / nav.cell)
        if (cx < 0 || cz < 0 || cx >= nav.cols || cz >= nav.rows) return 0
        const stair = stairs.get(`${cx},${cz}`)
        if (stair) {
          const lx = (x - nav.originX) / nav.cell - cx
          const lz = (z - nav.originZ) / nav.cell - cz
          let u = stair.dir === '+x' ? lx : stair.dir === '-x' ? 1 - lx : stair.dir === '+z' ? lz : 1 - lz
          u = Math.min(1, Math.max(0, u))
          return stair.low + (stair.high - stair.low) * u
        }
        return cells[cz * nav.cols + cx] ?? 0
      }

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.setPixelRatio(1)
      renderer.toneMappingExposure = 1.35
      document.body.appendChild(renderer.domElement)
      const scene = new THREE.Scene()
      scene.background = new THREE.Color('#2a2428')
      scene.fog = new THREE.Fog('#2a2428', 18, 70)
      scene.add(new THREE.HemisphereLight('#e4d6c4', '#3a2c24', 1.75))
      scene.add(new THREE.AmbientLight('#ffffff', 1.1))
      const sun = new THREE.DirectionalLight('#fff2d8', 1.4)
      sun.position.set(18, 28, 10)
      scene.add(sun)

      const loader = new GLTFLoader()
      const cache = new Map()
      async function model(name) {
        if (!cache.has(name)) cache.set(name, loader.loadAsync(`${root}/${name}`))
        return cache.get(name)
      }
      const names = [...new Set(places.parts.map((p) => p.model))]
      await Promise.all(names.map((n) => model(n)))
      for (const part of places.parts) {
        const gltf = await model(part.model)
        const obj = gltf.scene.clone(true)
        obj.position.set(part.x, part.y, part.z)
        obj.rotation.y = part.rotY || 0
        if (part.scale) obj.scale.setScalar(part.scale)
        scene.add(obj)
      }

      const feet = groundY(14, 16)
      const hero = new THREE.Group()
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.28, 0.9, 4, 10),
        new THREE.MeshStandardMaterial({ color: '#e07a3d', roughness: 0.6 }),
      )
      body.position.y = 0.95
      hero.add(body)
      hero.position.set(14, feet, 16)
      scene.add(hero)

      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.05, 180)
      if (cam === 'top') {
        camera.position.set(14, 36, 16)
        camera.up.set(0, 0, -1)
        camera.lookAt(14, 0, 16)
      } else {
        const x = 14
        const y = feet + 1.5
        const z = 16
        const theta = Math.PI
        const phi = 1.2
        const radius = 4.5
        const sinPhi = Math.sin(phi)
        const ox = radius * sinPhi * Math.sin(theta)
        const oy = radius * Math.cos(phi)
        const oz = radius * sinPhi * Math.cos(theta)
        const horiz = Math.hypot(ox, oz) || 1
        const fx = -ox / horiz
        const fz = -oz / horiz
        const shoulder = 1.85
        camera.position.set(x + ox + -fz * shoulder, y + oy, z + oz + fx * shoulder)
        camera.lookAt(x + fx * 7.5, y, z + fz * 7.5)
      }
      renderer.render(scene, camera)
      document.title = 'ready'
    </script>
  </body>
</html>
